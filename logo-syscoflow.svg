<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="SyscoFlow">
  <title>SyscoFlow</title>
  <!--
    Le folio.

    Deux colonnes qui commencent et finissent exactement à la même hauteur et
    portent exactement la même quantité de matière : 24 + 20 à gauche,
    18 + 14 + 12 à droite, soit 44 unités de chaque côté. Même total,
    composition différente : c'est le bilan sans métaphore.

    Le bloc en accent est le dernier et le plus petit du passif, à la place
    qu'occupe le résultat de l'exercice, celui qui fait boucler l'état.

    La couleur ne porte aucune information : en une seule encre, l'égalité des
    hauteurs reste lisible puisqu'elle repose sur la géométrie seule.
  -->

  <!-- Actif : deux masses -->
  <rect x="6" y="6" width="24" height="24" rx="1.5" fill="#059669" />
  <rect x="6" y="38" width="24" height="20" rx="1.5" fill="#059669" />

  <!-- Passif : trois masses, même hauteur cumulée -->
  <rect x="34" y="6" width="24" height="18" rx="1.5" fill="#059669" />
  <rect x="34" y="28" width="24" height="14" rx="1.5" fill="#059669" />
  <rect x="34" y="46" width="24" height="12" rx="1.5" fill="#C2410C" />
</svg>
