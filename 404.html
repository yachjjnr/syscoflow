<!doctype html>
<html lang="fr">

  <head>
    <meta charset="UTF-8" />
    <!--
      Pas de maximum-scale : un état financier est un tableau dense, et sur un
      écran de téléphone la première chose qu'un comptable fait est d'agrandir
      pour vérifier un chiffre. Le lui interdire serait le renvoyer.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Politique de sécurité de contenu.
      =================================

      Ce n'est pas une mesure de sécurité parmi d'autres, c'est LA preuve que
      SyscoFlow n'envoie rien.

      Le premier comptable à avoir essayé l'outil a demandé : « quelle
      assurance que les balances ne seront pas capturées ? ». On peut lui
      répondre trois choses, de la plus faible à la plus forte.

      Que l'application fonctionne sans réseau : cela montre qu'elle n'a besoin
      de rien, mais un programme peut très bien fonctionner hors ligne ET
      transmettre dès qu'il trouve une connexion.

      Qu'aucune requête ne part, réseau actif, ce qui se vérifie dans l'onglet
      Réseau du navigateur : c'est déjà une observation directe, mais elle
      porte sur un moment donné.

      Et enfin ceci, qui est d'une autre nature : « connect-src 'self' »
      ordonne au NAVIGATEUR de refuser toute connexion sortante vers un autre
      domaine. Ce n'est plus une promesse de l'auteur, c'est une interdiction
      que le navigateur applique, y compris contre l'auteur. Si une version
      future tentait d'envoyer une balance, la requête serait bloquée et
      l'utilisateur verrait l'erreur.

      Cette règle est lisible par n'importe qui, dans le code source de la
      page, sans savoir programmer.

      Détail des directives :
        default-src 'self'      rien ne vient d'ailleurs que de ce site
        connect-src 'self'      aucune requête sortante hors de ce site
        form-action 'none'      aucun formulaire ne peut soumettre où que ce soit
        object-src 'none'       ni greffon ni contenu embarqué
        base-uri 'self'         l'origine des chemins ne peut être détournée
        frame-ancestors 'none'  la page ne peut pas être encadrée par un tiers

      'unsafe-inline' sur les styles est nécessaire : React et Tailwind posent
      des styles en ligne. Cela ne concerne pas l'envoi de données.
      blob: sert aux PDF et classeurs produits localement, qui sont créés en
      mémoire dans le navigateur et n'ont pas d'adresse sur le réseau.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      connect-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'none';
      frame-ancestors 'none';
    " />

    <title>SyscoFlow — États Financiers SYSCOHADA</title>
    <meta name="description" content="Générez automatiquement vos états financiers SYSCOHADA Révisé à partir de votre balance des comptes. Conforme à l'AUDCIF pour les 17 pays OHADA." />
    <!-- Le SVG sert directement de favicon : il est conçu pour tenir à 16 px. -->
    <link rel="icon" type="image/svg+xml" href="/syscoflow/logo-syscoflow.svg" />
    <link rel="apple-touch-icon" href="/syscoflow/icone-192.png" />
    <meta name="theme-color" content="#059669" />

    <!--
      Manifeste d'application.

      Permet l'installation sur l'écran d'accueil, ce qui compte pour un outil
      qu'on ouvre au moment d'une clôture, et sert la démonstration de
      confidentialité : une application installée qui fonctionne sans réseau
      prouve d'elle-même qu'elle n'envoie rien.
    -->
    <link rel="manifest" href="/syscoflow/manifest.webmanifest" />

    <!--
      Aperçu de partage.

      En Afrique de l'Ouest, un lien se transmet par WhatsApp bien avant d'être
      cliqué depuis un moteur de recherche. Sans ces balises, le lien s'affiche
      nu, sans titre ni image, et ne donne aucune raison de l'ouvrir.

      og:url et og:image doivent porter une adresse ABSOLUE : les robots de
      WhatsApp, LinkedIn et Facebook ne résolvent pas toujours un chemin
      relatif. Remplacer https://syscoflow.example par le domaine réel au
      moment de la mise en ligne, voir DEPLOIEMENT.md.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SyscoFlow" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="SyscoFlow — vos états financiers SYSCOHADA depuis votre balance" />
    <meta property="og:description" content="Déposez votre balance, récupérez le Bilan, le Compte de résultat, le Tableau des flux de trésorerie et les Notes annexes. Conforme au SYSCOHADA Révisé (AUDCIF 2017). Aucune donnée comptable ne quitte votre ordinateur." />
    <meta property="og:url" content="https://yachjjnr.github.io/syscoflow/" />
    <meta property="og:image" content="https://yachjjnr.github.io/syscoflow/og-syscoflow.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SyscoFlow, états financiers SYSCOHADA Révisé" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SyscoFlow — vos états financiers SYSCOHADA depuis votre balance" />
    <meta name="twitter:description" content="Bilan, Compte de résultat, Flux de trésorerie et Notes annexes, générés depuis votre balance. Rien ne quitte votre ordinateur." />
    <meta name="twitter:image" content="https://yachjjnr.github.io/syscoflow/og-syscoflow.png" />
    <!--
      Fraunces  : sérif variable, chaleureuse mais grave — les titres.
      Public Sans : sans-sérif du design system fédéral américain, conçue pour
                    les documents administratifs — le texte courant.
      IBM Plex Mono : chasse fixe institutionnelle, chiffres tabulaires — les montants.

      Elles sont servies AVEC le site, depuis client/src/polices.css, et non
      plus depuis fonts.googleapis.com.

      Trois raisons. La promesse de confidentialité d'abord : chaque visite
      était sinon connue de Google, qui en recevait l'adresse IP. Le
      fonctionnement hors ligne ensuite, puisqu'une police servie par un tiers
      n'entre pas dans notre cache et que l'application perdait sa typographie
      sans réseau. La vitesse enfin, un aller-retour vers un domaine tiers en
      moins là où chaque aller-retour se paie.
    -->
    <script type="module" crossorigin src="/syscoflow/assets/index-Ddj0LJh1.js"></script>
    <link rel="stylesheet" crossorigin href="/syscoflow/assets/index-CBcY7Vf7.css">
