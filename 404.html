    <!--
      Pas de maximum-scale : un état financier est un tableau dense, et sur un
      écran de téléphone la première chose qu'un comptable fait est d'agrandir
      pour vérifier un chiffre. Le lui interdire serait le renvoyer.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/svg+xml" href="/syscoflow/logo-syscoflow.svg" />
    <meta name="theme-color" content="#059669" />

    <!--
      Aperçu de partage.

      En Afrique de l'Ouest, un lien se transmet par WhatsApp bien avant d'être
      cliqué depuis un moteur de recherche. Sans ces balises, le lien s'affiche
      nu, sans titre ni image, et ne donne aucune raison de l'ouvrir.

      og:url et og:image doivent porter une adresse ABSOLUE : les robots de
      WhatsApp, LinkedIn et Facebook ne résolvent pas toujours un chemin
      relatif. Remplacer https://syscoflow.example par le domaine réel au
      moment de la mise en ligne, voir DEPLOIEMENT.md.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SyscoFlow" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="SyscoFlow — vos états financiers SYSCOHADA depuis votre balance" />
    <meta property="og:description" content="Déposez votre balance, récupérez le Bilan, le Compte de résultat, le Tableau des flux de trésorerie et les Notes annexes. Conforme au SYSCOHADA Révisé (AUDCIF 2017). Aucune donnée comptable ne quitte votre ordinateur." />
    <meta property="og:url" content="https://yachjjnr.github.io/syscoflow/" />
    <meta property="og:image" content="https://yachjjnr.github.io/syscoflow/og-syscoflow.png" />
